site_name: "keycut"
site_description: "A command line tool that helps you remembering ALL the numerous keyboard shortcuts of ALL your favorite programs."
site_url: "https://pawamoy.github.io/keycut"
repo_url: "https://github.com/pawamoy/keycut"
repo_name: "pawamoy/keycut"

nav:
- Home:
  - Overview: index.md
  - API Reference:
    - cli.py: reference/cli.md
    - load.py: reference/load.md
    - render.py: reference/render.md
    - search.py: reference/search.md
    - ui.py: reference/ui.md
    - utils.py: reference/utils.md
    - watch.py: reference/watch.md
  - Contributing: contributing.md
  - Code of Conduct: code_of_conduct.md
  - Changelog: changelog.md
  - Credits: credits.md
  - License: license.md
- Code Reference:
  - cli.py: reference/cli.md
- Development:
  - Contributing: contributing.md
  - Code of Conduct: code_of_conduct.md
  - Coverage report: coverage.md

theme:
  name: material
  features:
  - navigation.tabs
  palette:
    scheme: slate
    primary: teal
    accent: purple

extra_css:
- css/mkdocstrings.css

markdown_extensions:
- admonition
- pymdownx.emoji
- pymdownx.magiclink
- pymdownx.snippets:
    check_paths: true
- pymdownx.superfences
- pymdownx.tabbed
- pymdownx.tasklist
- toc:
    permalink: true

plugins:
- search
- coverage:
    html_report_dir: build/coverage
- mkdocstrings:
    watch:
    - src/keycut
- macros:
    module_name: docs/macros
